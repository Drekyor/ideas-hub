<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ideas Hub</title>

    <style>
      body {
        line-height: 1.6;
        letter-spacing: 0.2px;
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 20px;

        background-image:
          linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)),
          url("https://images.unsplash.com/photo-1521737604893-d14cc237f11d");

        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;

        color: #e5e7eb;
      }

      .container {
        max-width: 800px;
        margin: auto;
        padding: 40px 20px;
      }

      h1 {
        text-align: center;
        font-size: 36px;
        margin-bottom: 10px;
      }

      .description {
        text-align: center;
        color: #cbd5e1;
        margin-bottom: 30px;
        font-size: 16px;
        line-height: 1.5;
      }

      .form-box {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(10px);
        padding: 20px;
        border-radius: 16px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        margin-bottom: 30px;
      }

      input,
      textarea,
      select {
        width: 100%;
        padding: 12px;
        margin-top: 10px;
        margin-bottom: 15px;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.08);
        color: #ffffff;
        outline: none;
        box-sizing: border-box;
      }

      button {
        width: 100%;
        padding: 12px;
        background: #6366f1;
        border: none;
        color: white;
        font-size: 16px;
        border-radius: 10px;
        cursor: pointer;
        transition: 0.2s;
      }

      button:hover {
        background: #4f46e5;
      }

      .analyze-btn {
        background: linear-gradient(135deg, #06b6d4, #8b5cf6);
      }

      .analyze-btn:hover {
        background: #059669;
      }

      .idea {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 15px;
        border-radius: 14px;
        margin-bottom: 12px;

        transition:
          transform 0.25s ease,
          box-shadow 0.25s ease;
      }

      .animate-card {
        animation: fadeInUp 0.4s ease;
      }

      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .idea:hover {
        transform: translateY(-6px);
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
      }

      .idea h3 {
        margin: 0;
        font-size: 18px;
        color: #fff;
      }

      .idea p {
        color: #cbd5e1;
        margin-top: 6px;
        font-size: 14px;
      }

      small {
        display: block;
        color: #94a3b8;
        margin-bottom: 10px;
        font-size: 12px;
      }

      select {
        appearance: none;
        -webkit-appearance: none;
        -moz-appearance: none;

        background: rgba(255, 255, 255, 0.08);
        color: white;
        cursor: pointer;
      }

      select option {
        background: #1e293b;
        color: white;
      }

      #ideasList {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: 16px;
        align-items: start;
      }
      .idea-description {
        display: -webkit-box;
        -webkit-box-orient: vertical;

        -webkit-line-clamp: 2;
        line-clamp: 2;

        overflow: hidden;
        text-overflow: ellipsis;
      }

      .idea-description.expanded {
        display: block;
      }

      .idea {
        position: relative;
        overflow: hidden;

        width: 100%;
        max-width: 100%;
      }

      .idea::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          45deg,
          transparent,
          rgba(255, 255, 255, 0.03),
          transparent
        );
        transform: translateX(-100%);
        transition: 0.6s;
      }

      .idea:hover::before {
        transform: translateX(100%);
      }

      .badge {
        background: rgba(99, 102, 241, 0.2);
        color: #a5b4fc;
        padding: 4px 10px;
        border-radius: 999px;
        display: inline-block;
        margin-bottom: 8px;
        font-size: 12px;
        font-weight: bold;
      }

      #toast {
        position: fixed;
        bottom: 30px;
        right: 30px;
        background: rgba(15, 23, 42, 0.95);
        color: white;
        padding: 14px 20px;
        border-radius: 14px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.35);
        font-size: 14px;
        z-index: 9999;

        opacity: 0;
        transform: translateY(20px);
        pointer-events: none;
        transition: all 0.3s ease;
      }

      #toast.show {
        opacity: 1;
        transform: translateY(0);
      }

      .comments-box {
        margin-top: 10px;
        max-width: 100%;
      }

      .comments-box div {
        background: rgba(255, 255, 255, 0.04);
        padding: 8px;
        border-radius: 8px;
        margin-top: 6px;
        font-size: 13px;
      }
    </style>
  </head>

  <body>
    <div id="toast"></div>
    <div style="text-align: center; margin-bottom: 20px">
      <select id="lang" onchange="changeLang()">
        <option value="it">🇮🇹 Italiano</option>
        <option value="en">🇬🇧 English</option>
        <option value="es">🇪🇸 Español</option>
      </select>
    </div>

    <div class="container">
      <h1 data-i18n="title">💡 Dall’idea alla realtà</h1>

      <p class="description" data-i18n="desc1">Benvenuto su Ideas Hub!</p>
      <p class="description" data-i18n="desc2">
        Hai un’idea, una necessità o un problema da risolvere? Utilizza questo
        spazio per raccontarlo. La tua proposta potrebbe diventare una vera app,
        un sito web o una piattaforma digitale capace di aiutare migliaia di
        persone.
      </p>

      <select id="sortSelect" onchange="renderIdeas()">
        <option value="likes">🔥 Più votate</option>
        <option value="date">🕒 Più recenti</option>
      </select>

      <div class="form-box">
        <input
          type="text"
          id="title"
          data-i18n-placeholder="titlePlaceholder"
        />
        <textarea
          id="description"
          data-i18n-placeholder="descPlaceholder"
        ></textarea>

        <select id="category">
          <option value="">-- Seleziona categoria --</option>
          <option value="app">📱 App</option>
          <option value="software">💻 Software</option>
          <option value="web">🌐 Pagina Web</option>
          <option value="other">❌ Altro</option>
        </select>

        <button onclick="addIdea()" data-i18n="publishBtn">
          🚀 Pubblica Idea
        </button>
      </div>

      <div id="ideasList"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <script>
      const firebaseConfig = {
        apiKey: "AIzaSyBkmTcMmTRhOJ0PRUvpldplEc7j7KpQ7SE",
        authDomain: "ideas-hub-57e75.firebaseapp.com",
        projectId: "ideas-hub-57e75",
        storageBucket: "ideas-hub-57e75.firebasestorage.app",
        messagingSenderId: "198474726570",
        appId: "1:198474726570:web:8323e9b6306c3f3cf9e4d3",
      };

      firebase.initializeApp(firebaseConfig);
      const db = firebase.firestore();

      let ideas = [];

      function isValidText(text) {
        const clean = text.toLowerCase().trim();

        if (clean.length < 5) return false;

        // almeno 3 vocali
        const vowels = clean.match(/[aeiouàèéìòù]/g);
        if (!vowels || vowels.length < 3) return false;

        // almeno 3 lettere diverse
        const letters = clean.replace(/[^a-zàèéìòù]/g, "");
        const unique = new Set(letters);
        if (unique.size < 4) return false;

        // evita stringhe ripetute tipo "aaaaaa"
        if (/^(.)\1+$/.test(clean)) return false;

        return true;
      }

      db.collection("ideas").onSnapshot((snapshot) => {
        ideas = [];

        snapshot.forEach((doc) => {
          ideas.push({
            id: doc.id,
            ...doc.data(),
          });
        });

        renderIdeas();
      });

      function renderIdeas() {
        const ideasList = document.getElementById("ideasList");
        ideasList.innerHTML = "";

        const sortBy = document.getElementById("sortSelect")?.value || "likes";

        if (sortBy === "likes") {
          ideas.sort((a, b) => (b.likes || 0) - (a.likes || 0));
        } else {
          ideas.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
        }

        ideas.forEach((idea, index) => {
          const box = document.createElement("div");
          box.className = "idea animate-card";

          box.innerHTML = `
                  <h3>${idea.title}</h3>
                  <small class="badge">${idea.category}</small>
                  <p id="desc-${idea.id}" class="idea-description">
                      ${idea.description}
                  </p>

                  <small onclick="toggleDescription('${idea.id}', this)"
                  style="cursor:pointer; color:#818cf8;">
                      Continua a leggere
                  </small>

                  <small>📌 ${idea.category}</small>
                  <div style="display:flex; gap:8px; margin-top:10px;">
                      <button onclick="likeIdea('${idea.id}')">
                        👍 ${idea.likes || 0}
                      </button>

                      <button onclick="dislikeIdea('${idea.id}')">
                        👎 ${idea.dislikes || 0}
                      </button>

                      <button onclick="commentIdea('${idea.id}')">💬</button>
                  </div>

                  <button class="analyze-btn" onclick="analyzeIdea('${idea.id}', \`${idea.title} ${idea.description}\`)">
                      🧠 Analizza idea
                  </button>

                  <p id="ai-result-${idea.id}" style="color:#a5b4fc; margin-top:6px;"></p>

                  <div id="comments-${idea.id}" class="comments-box"></div>
                  `;

          ideasList.appendChild(box);
          loadComments(idea.id);
        });
      }

      let lastPostTime = 0;

      function addIdea() {
        console.log("🔥 addIdea entrata");

        if (!requireUser()) return;

        const now = Date.now();

        if (now - lastPostTime < 10000) {
          showToast(
            "⏳ Aspetta qualche secondo prima di pubblicare un'altra idea",
          );
          return;
        }

        lastPostTime = now;

        const title = document.getElementById("title").value;
        const description = document.getElementById("description").value;
        const category = document.getElementById("category").value;

        if (!title || !description || !category) {
          showToast("⚠️ Compila tutti i campi");
          return;
        }

        if (category === "other") {
          showToast(
            "⚠️ Al momento sono accettate solo App, Software e Pagine Web",
          );
          return;
        }

        if (title.length < 3 || title.length > 50) {
          showToast("Titolo deve avere tra 3 e 50 caratteri");
          return;
        }

        if (description.length < 10 || description.length > 500) {
          showToast("Descrizione deve avere tra 10 e 500 caratteri");
          return;
        }

        if (!isValidText(title)) {
          showToast("Titolo non valido o senza senso");
          return;
        }

        if (!isValidText(description)) {
          showToast("Descrizione non valida o senza senso");
          return;
        }

        db.collection("ideas").add({
          title: title,
          description: description,
          category: category,
          votes: 0,
          likes: 0,
          dislikes: 0,
          date: new Date().toLocaleString("it-IT"),
          createdAt: new Date().toISOString(),
        });

        showToast("🚀 Idea pubblicata con successo!");

        document.getElementById("title").value = "";
        document.getElementById("description").value = "";
      }

      const texts = {
        it: {
          title: "💡 Dall’idea alla realtà",
          desc1: "Benvenuto su Ideas Hub!",
          desc2:
            "Hai un’idea, una necessità o un problema da risolvere? Utilizza questo spazio per raccontarlo. La tua proposta potrebbe diventare una vera app, un sito web o una piattaforma digitale capace di aiutare migliaia di persone.",
          titlePlaceholder: "Titolo idea",
          descPlaceholder: "Descrivi la tua idea...",
          publishBtn: "🚀 Pubblica Idea",
        },

        en: {
          title: "💡 From idea to reality",
          desc1: "Welcome to Ideas Hub!",
          desc2:
            "Do you have an idea, a need or a problem to solve? Use this space to describe it. Your proposal could become a real app, website or digital platform that helps thousands of people.",
          titlePlaceholder: "Idea title",
          descPlaceholder: "Describe your idea...",
          publishBtn: "🚀 Publish Idea",
        },

        es: {
          title: "💡 De la idea a la realidad",
          desc1: "Bienvenido a Ideas Hub!",
          desc2:
            "¿Tienes una idea, una necesidad o un problema que resolver? Usa este espacio para describirlo. Tu propuesta podría convertirse en una app, sitio web o plataforma digital que ayude a miles de personas.",
          titlePlaceholder: "Título de la idea",
          descPlaceholder: "Describe tu idea...",
          publishBtn: "🚀 Publicar idea",
        },
      };

      function applyLanguage(lang) {
        document.querySelectorAll("[data-i18n]").forEach((el) => {
          const key = el.getAttribute("data-i18n");
          el.innerText = texts[lang][key];
        });

        document.querySelectorAll("[data-i18n-placeholder]").forEach((el) => {
          const key = el.getAttribute("data-i18n-placeholder");
          el.placeholder = texts[lang][key];
        });

        localStorage.setItem("lang", lang);
      }

      function changeLang() {
        const lang = document.getElementById("lang").value;
        applyLanguage(lang);
      }

      window.onload = () => {
        const saved = localStorage.getItem("lang") || "it";
        document.getElementById("lang").value = saved;
        applyLanguage(saved);
      };

      function toggleDescription(id, el) {
        const desc = document.getElementById("desc-" + id);

        desc.classList.toggle("expanded");

        el.innerText = desc.classList.contains("expanded")
          ? "Riduci"
          : "Continua a leggere";
      }

      function likeIdea(id) {
        if (!requireUser()) return;

        const ref = db
          .collection("ideas")
          .doc(id)
          .collection("reactions")
          .doc(currentUser.uid);

        const ideaRef = db.collection("ideas").doc(id);

        ref.get().then((doc) => {
          const prev = doc.exists ? doc.data().type : null;

          if (prev === "like") {
            showToast("⚠️ Hai già messo like!");
            return;
          }

          const batch = db.batch();

          // se prima era dislike → correggi contatore
          if (prev === "dislike") {
            batch.update(ideaRef, {
              dislikes: firebase.firestore.FieldValue.increment(-1),
            });
          }

          batch.set(ref, { type: "like" });

          batch.update(ideaRef, {
            likes: firebase.firestore.FieldValue.increment(1),
          });

          batch.commit();
        });
      }
      function dislikeIdea(id) {
        if (!requireUser()) return;

        const ref = db
          .collection("ideas")
          .doc(id)
          .collection("reactions")
          .doc(currentUser.uid);

        const ideaRef = db.collection("ideas").doc(id);

        ref.get().then((doc) => {
          const prev = doc.exists ? doc.data().type : null;

          if (prev === "dislike") {
            showToast("⚠️ Hai già messo dislike!");
            return;
          }

          const batch = db.batch();

          if (prev === "like") {
            batch.update(ideaRef, {
              likes: firebase.firestore.FieldValue.increment(-1),
            });
          }

          batch.set(ref, { type: "dislike" });

          batch.update(ideaRef, {
            dislikes: firebase.firestore.FieldValue.increment(1),
          });

          batch.commit();
        });
      }

      function commentIdea(id) {
        if (!requireUser()) return;

        const text = prompt("Scrivi un commento:");
        if (!text || text.trim().length < 2) {
          showToast("⚠️ Commento troppo corto");
          return;
        }

        const showName = confirm("Vuoi rendere pubblico il tuo nome?");

        db.collection("ideas")
          .doc(id)
          .collection("comments")
          .add({
            text: text,
            userId: currentUser.uid,
            userName: showName
              ? currentUser.displayName.split(" ")[0]
              : "👤 Utente anonimo",
            date: new Date().toLocaleString("it-IT"),
          });
      }

      function loadComments(id) {
        db.collection("ideas")
          .doc(id)
          .collection("comments")
          .orderBy("date", "desc")
          .onSnapshot((snapshot) => {
            const container = document.getElementById("comments-" + id);

            if (!container) return;

            container.innerHTML = "";

            snapshot.forEach((doc) => {
              const comment = doc.data();

              container.innerHTML += `
              <div style="
                background: rgba(255,255,255,0.04);
                padding:8px;
                border-radius:8px;
                margin-top:6px;
                font-size:13px;
              ">
                💬 ${comment.text}
                <br>
                <small>${comment.userName || "Anonimo"}</small>

                ${
                  currentUser && comment.userId === currentUser.uid
                    ? `<button 
                        onclick="deleteComment('${id}', '${doc.id}')"
                        style="margin-top:6px; background:#ef4444;">
                        🗑 Elimina
                      </button>`
                    : ""
                }
              </div>
              `;
            });
          });
      }

      function analyzeIdea(id, text) {
        const t = text.toLowerCase();

        let score = 0;
        let feedback = "";

        // 📏 lunghezza più intelligente
        if (t.length > 250) score += 3;
        else if (t.length > 120) score += 2;
        else score += 1;

        // 💡 keyword positive
        const strongKeywords = [
          "app",
          "software",
          "web",
          "piattaforma",
          "ai",
          "intelligenza",
          "automazione",
          "startup",
          "innovazione",
          "problema",
          "soluzione",
        ];

        strongKeywords.forEach((word) => {
          if (t.includes(word)) score += 1;
        });

        // 🧠 qualità logica (bonus se idea “concreta”)
        if (
          t.includes("per") ||
          t.includes("aiuta") ||
          t.includes("permette")
        ) {
          score += 1;
        }

        // 🌍 lingua dal sito
        const lang = localStorage.getItem("lang") || "it";

        // 🧠 valutazione finale più precisa
        if (score <= 3) {
          feedback =
            lang === "en"
              ? "⚠️ Weak idea, needs development"
              : lang === "es"
                ? "⚠️ Idea débil, necesita mejoras"
                : "⚠️ Idea debole, da sviluppare meglio";
        } else if (score <= 6) {
          feedback =
            lang === "en"
              ? "👍 Good idea with potential"
              : lang === "es"
                ? "👍 Buena idea con potencial"
                : "👍 Buona idea con potenziale";
        } else if (score <= 8) {
          feedback =
            lang === "en"
              ? "🚀 Very strong idea"
              : lang === "es"
                ? "🚀 Idea muy fuerte"
                : "🚀 Idea molto forte";
        } else {
          feedback =
            lang === "en"
              ? "🔥 Excellent idea, startup level"
              : lang === "es"
                ? "🔥 Excelente idea, nivel startup"
                : "🔥 Idea eccellente, livello startup";
        }

        const el = document.getElementById("ai-result-" + id);
        if (el) el.innerText = feedback;
      }

      function showToast(message) {
        const toast = document.getElementById("toast");

        toast.innerText = message;
        toast.classList.add("show");

        setTimeout(() => {
          toast.classList.remove("show");
        }, 3000);
      }

      const auth = firebase.auth();
      let currentUser = null;

      // recupera utente dopo redirect Google
      auth
        .getRedirectResult()
        .then((result) => {
          if (result.user) {
            currentUser = result.user;
            console.log("Redirect login:", result.user.uid);
          }
        })
        .catch((error) => {
          console.error("Redirect error:", error);
        });

      // controlla sessione già esistente
      auth.onAuthStateChanged((user) => {
        if (user) {
          currentUser = user;
          console.log("Login:", user.uid);

          // 🔥 SE C'ERA UN'AZIONE IN SOSPESO, ESEGUILA
          if (window.pendingAction) {
            const action = window.pendingAction;
            window.pendingAction = null;
            action();
          }
        }
      });

      // login manuale solo quando serve
      function login() {
        const provider = new firebase.auth.GoogleAuthProvider();

        auth
          .signInWithPopup(provider)
          .then((result) => {
            currentUser = result.user;
            console.log("Login OK:", currentUser.uid);
          })
          .catch((error) => {
            console.error("Login error:", error);
          });
      }

      function requireUser() {
        if (currentUser) return true;

        showToast("🔐 Effettua il login con Google");
        login();
        return false;
      }

      function deleteComment(ideaId, commentId) {
        db.collection("ideas")
          .doc(ideaId)
          .collection("comments")
          .doc(commentId)
          .delete();

        showToast("🗑 Commento eliminato");
      }
    </script>
  </body>
</html>
