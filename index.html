<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ideas Hub</title>

<style>
    body {
        line-height: 1.6;
        letter-spacing: 0.2px;
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 20px;

        background-image: linear-gradient(
        rgba(0,0,0,0.6),
        rgba(0,0,0,0.6)
        ),
        url("https://images.unsplash.com/photo-1521737604893-d14cc237f11d");

        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;

        color: #e5e7eb;
    }

    .container {
        max-width: 800px;
        margin: auto;
        padding: 40px 20px;
    }

    h1 {
        text-align: center;
        font-size: 36px;
        margin-bottom: 10px;
    }

    .description {
        text-align: center;
        color: #cbd5e1;
        margin-bottom: 30px;
        font-size: 16px;
        line-height: 1.5;
    }

    .form-box {
        background: rgba(255,255,255,0.05);
        backdrop-filter: blur(10px);
        padding: 20px;
        border-radius: 16px;
        border: 1px solid rgba(255,255,255,0.1);
        margin-bottom: 30px;
    }

    input, textarea {
        width: 100%;
        padding: 12px;
        margin-top: 10px;
        margin-bottom: 15px;
        border-radius: 10px;
        border: 1px solid rgba(255,255,255,0.1);
        background: rgba(255,255,255,0.08);
        color: #ffffff;
        outline: none;
        box-sizing: border-box;
    }

    button {
        width: 100%;
        padding: 12px;
        background: #6366f1;
        border: none;
        color: white;
        font-size: 16px;
        border-radius: 10px;
        cursor: pointer;
        transition: 0.2s;
    }

    button:hover {
        background: #4f46e5;
    }

    .idea {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.1);
        padding: 15px;
        border-radius: 14px;
        margin-bottom: 12px;

        transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .animate-card {
    animation: fadeInUp 0.4s ease;
    }

    @keyframes fadeInUp {
    from {
        opacity: 0;
        transform: translateY(20px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
    }
    
    .idea:hover {
        transform: translateY(-6px);
        box-shadow: 0 10px 25px rgba(0,0,0,0.25);
    }

    .idea h3 {
        margin: 0;
        font-size: 18px;
        color: #fff;
    }

    .idea p {
        color: #cbd5e1;
        margin-top: 6px;
        font-size: 14px;
    }

    small {
        display: block;
        color: #94a3b8;
        margin-bottom: 10px;
        font-size: 12px;
}
</style>
</head>

<body>

<div class="container">

    <h1>💡 Dall’idea alla realtà</h1>

    <p class="description">
    Benvenuto su Ideas Hub!
    </p>
    <p class="description">
    Hai un’idea, una necessità o un problema da risolvere? Utilizza questo spazio
    per raccontarlo. La tua proposta potrebbe diventare una vera app, un sito web
    o una piattaforma digitale capace di aiutare migliaia di persone.
    </p>

    <div class="form-box">
        <input type="text" id="title" placeholder="Titolo idea">
        <textarea id="description" placeholder="Descrivi la tua idea..."></textarea>
        <button onclick="addIdea()">🚀 Pubblica Idea</button>
    </div>

    <div class="form-box">
        <h3>📩 Rimani aggiornato</h3>

        <input type="email" id="email" placeholder="Inserisci la tua email">

        <button onclick="saveEmail()">💾 Salva email</button>
    </div>

    <div id="ideasList"></div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyBkmTcMmTRhOJ0PRUvpldplEc7j7KpQ7SE",
  authDomain: "ideas-hub-57e75.firebaseapp.com",
  projectId: "ideas-hub-57e75",
  storageBucket: "ideas-hub-57e75.firebasestorage.app",
  messagingSenderId: "198474726570",
  appId: "1:198474726570:web:8323e9b6306c3f3cf9e4d3"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let ideas = [];

function saveEmail() {
    const email = document.getElementById("email").value.trim();

    if (!email) return;

    db.collection("emails")
        .where("email", "==", email)
        .get()
        .then((querySnapshot) => {

            if (!querySnapshot.empty) {
                alert("⚠️ Questa email è già registrata!");
                return;
            }

            db.collection("emails").add({
                email: email,
                date: new Date().toLocaleString("it-IT")
            });

            document.getElementById("email").value = "";
            alert("✅ Email salvata!");
        });
}

db.collection("ideas").onSnapshot((snapshot) => {
    ideas = [];

    snapshot.forEach((doc) => {
        ideas.push({
            id: doc.id,
            ...doc.data()
        });

    });

    renderIdeas();
});

function renderIdeas() {
    const ideasList = document.getElementById("ideasList");
    ideasList.innerHTML = "";

    ideas.sort((a, b) => b.votes - a.votes);

    ideas.forEach((idea, index) => {
        const box = document.createElement("div");
        box.className = "idea animate-card";

        box.innerHTML = `
            <h3>${idea.title}</h3>
            <p>${idea.description}</p>
            <small>📅 ${idea.date}</small>
            <p>👍 ${idea.votes} voti</p>
            <button onclick="voteIdea('${idea.id}')">👍 Vota</button>
        `;

        ideasList.appendChild(box);
    });
}

function addIdea() {
    const title = document.getElementById("title").value;
    const description = document.getElementById("description").value;

    if (!title || !description) return;

    db.collection("ideas").add({
        title: title,
        description: description,
        votes: 0,
        date: new Date().toLocaleString("it-IT")
    });

    document.getElementById("title").value = "";
    document.getElementById("description").value = "";
}

function voteIdea(id) {
    const userKey = localStorage.getItem("userKey") || crypto.randomUUID();
    localStorage.setItem("userKey", userKey);

    const voteRef = db.collection("ideas").doc(id);
    const userVoteRef = db.collection("votes")
        .doc(id + "_" + userKey);

    userVoteRef.get().then((doc) => {
        if (doc.exists) {
            alert("⚠️ Hai già votato questa idea!");
            return;
        }

        userVoteRef.set({ voted: true });

        voteRef.get().then((ideaDoc) => {
            const newVotes = (ideaDoc.data().votes || 0) + 1;

            voteRef.update({
                votes: newVotes
            });
        });
    });
}
</script>

</body>
</html>
